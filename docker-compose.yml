version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: autoheal_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: autoheal_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  fastapi_backend:
    build: .
    container_name: autoheal_backend
    command: uvicorn src.backend.app:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/autoheal_db
    depends_on:
      - postgres

  streamlit_dashboard:
    build: .
    container_name: autoheal_dashboard
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    depends_on:
      - fastapi_backend

volumes:
  pgdata:
